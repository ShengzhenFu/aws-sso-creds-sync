name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            # Release Notes
            This is a new release based on tag ${{ github.ref_name }}.
            # Add more detailed release notes here
          draft: false
          prerelease: false

  build-and-upload:
    name: Build and Upload Release Assets
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        goos:
          - linux
          - darwin
        goarch:
          - amd64
          - arm64
        exclude:
          - os: ubuntu-latest
            goos: darwin
          - os: macos-latest
            goos: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.4'

      - name: Install dependencies
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # 构建可执行文件
          BINARY_NAME="aws-sso-creds-sync"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -o "${BINARY_NAME}" main.go

          # 创建归档文件
          ARCHIVE_NAME="aws-sso-creds-sync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" "${BINARY_NAME}"

      - name: Upload Release Asset
        uses: actions/github-script@v6
        env:
          UPLOAD_URL: ${{ needs.create-release.outputs.upload_url }}
          ASSET_PATH: ./aws-sso-creds-sync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          ASSET_NAME: aws-sso-creds-sync-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // 使用环境变量代替直接在JS字符串中使用GitHub Actions变量
            const assetPath = process.env.ASSET_PATH;
            const assetName = process.env.ASSET_NAME;

            // 确保文件存在
            if (!fs.existsSync(assetPath)) {
              console.error(`错误: 文件 ${assetPath} 不存在`);
              core.setFailed(`找不到要上传的资产文件: ${assetPath}`);
              return;
            }

            const fileContent = fs.readFileSync(assetPath);

            // 使用upload_url而不是release_id，更可靠
            const uploadUrl = process.env.UPLOAD_URL;

            try {
              await github.rest.repos.uploadReleaseAsset({
                url: uploadUrl,
                name: assetName,
                data: fileContent,
                headers: {
                  'content-type': 'application/gzip',
                  'content-length': fileContent.length
                }
              });
              console.log(`成功上传资产: ${assetName}`);
            } catch (error) {
              console.error('上传资产失败:', error);
              // 避免因一个资产上传失败而影响整个工作流
              console.log('继续执行其他作业...');
            }
